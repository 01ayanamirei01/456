{% extends "base.html" %}
{% block content %}
<h1>Книги</h1>

<ul>
  {% for book in books %}
    <li>
      <a href="/books/{{ book.id }}/">{{ book.title }}</a>
      (ISBN: {{ book.isbn }})
      — <a href="/books/{{ book.id }}/edit/">Редактировать</a>
      — <a href="/books/{{ book.id }}/delete/">Удалить</a>
    </li>
  {% empty %}
    <li>Нет книг</li>
  {% endfor %}
</ul>
{% endblock %}
